[mod]
id = "voltz_core"
version = "0.1.0"
priority = 100

# Uses only Horizon's native hook points (hooks 45 in compatibility.json); tested on this commit of main.
[compatibility]
horizon_revision = "13e02505624fb200a76c938b948dceb45e36ded6"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "voltz_glue"
source = "voltz_glue.rs"

[[module]]
id = "engine"
file = "crates/horizon-client/src/game.rs"
name = "voltz_engine"
source = "voltz_engine.rs"

[[injection]]
id = "block_entity"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity"
kind = "HEAD"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "block_entity_ticks"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_ticks"
kind = "HEAD"
helper = "block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "block_entity_container"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_container"
kind = "HEAD"
helper = "block_entity_container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "block_entity_tick"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_tick"
kind = "HEAD"
helper = "block_entity_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "block_entity_update_tag"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_update_tag"
kind = "HEAD"
helper = "block_entity_update_tag.rs"
bindings = [
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "entity" },
  { name = "tag", ty = "&mut Option<horizon_world::nbt::Compound>", value = "&mut *tag" },
]

[[injection]]
id = "server_tick"
target = "horizon_client::game::native_hooks::Game<'_>::native_server_tick"
kind = "HEAD"
helper = "server_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "crate::game::native_lifecycle::ServerTickPhase", value = "phase" },
]

[[injection]]
id = "chunk_load"
target = "horizon_client::game::native_hooks::Game<'_>::native_chunk_load"
kind = "HEAD"
helper = "chunk_load.rs"
bindings = [
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "chunk", ty = "[i32; 2]", value = "chunk" },
  { name = "new", ty = "bool", value = "new" },
]

[[injection]]
id = "level_tick_post"
target = "horizon_client::game::native_hooks::Game<'_>::native_level_tick_post"
kind = "HEAD"
helper = "level_tick_post.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
